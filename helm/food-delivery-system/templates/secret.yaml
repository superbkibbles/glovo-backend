apiVersion: v1
kind: Secret
metadata:
  name: food-delivery-secrets
  namespace: {{ include "food-delivery-system.namespace" . }}
  labels:
    {{- include "food-delivery-system.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  MONGO_URI: {{ .Values.secrets.mongoUri | quote }}
  REDIS_URI: {{ .Values.secrets.redisUri | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  PASSWORD_PEPPER: {{ .Values.secrets.passwordPepper | quote }}
  SUPERADMIN_USERNAME: {{ .Values.secrets.superadminUsername | quote }}
  SUPERADMIN_PASSWORD: {{ .Values.secrets.superadminPassword | quote }}
  {{- if .Values.secrets.firebaseCredentials }}
  FIREBASE_CREDENTIALS: {{ .Values.secrets.firebaseCredentials | quote }}
  {{- end }}

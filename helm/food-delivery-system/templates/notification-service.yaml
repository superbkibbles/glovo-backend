{{- $service := index .Values.services "notification-service" }}
{{- if $service.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: {{ include "food-delivery-system.namespace" . }}
  labels:
    app: notification-service
    {{- include "food-delivery-system.labels" . | nindent 4 }}
spec:
  replicas: {{ $service.replicas }}
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        {{- include "food-delivery-system.labels" . | nindent 8 }}
    spec:
      volumes:
        - name: firebase-credentials
          secret:
            secretName: food-delivery-secrets
            items:
              - key: FIREBASE_CREDENTIALS
                path: firebase-credentials.json
      containers:
        - name: notification-service
          image: {{ include "food-delivery-system.image" (dict "image" $service.image "tag" $service.tag "global" .Values.global) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $service.port }}
          envFrom:
            - configMapRef:
                name: food-delivery-config
            - secretRef:
                name: food-delivery-secrets
          volumeMounts:
            - name: firebase-credentials
              mountPath: /app/firebase-credentials.json
              subPath: firebase-credentials.json
              readOnly: true
          resources:
            {{- toYaml $service.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: {{ include "food-delivery-system.namespace" . }}
  labels:
    app: notification-service
    {{- include "food-delivery-system.labels" . | nindent 4 }}
spec:
  selector:
    app: notification-service
  ports:
    - port: {{ $service.port }}
      targetPort: {{ $service.port }}
{{- end }}

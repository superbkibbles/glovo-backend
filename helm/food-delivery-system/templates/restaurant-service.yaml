{{- $service := index .Values.services "restaurant-service" }}
{{- if $service.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
  namespace: {{ include "food-delivery-system.namespace" . }}
  labels:
    app: restaurant-service
    {{- include "food-delivery-system.labels" . | nindent 4 }}
spec:
  replicas: {{ $service.replicas }}
  selector:
    matchLabels:
      app: restaurant-service
  template:
    metadata:
      labels:
        app: restaurant-service
        {{- include "food-delivery-system.labels" . | nindent 8 }}
    spec:
      containers:
        - name: restaurant-service
          image: {{ include "food-delivery-system.image" (dict "image" $service.image "tag" $service.tag "global" .Values.global) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $service.port }}
          envFrom:
            - configMapRef:
                name: food-delivery-config
            - secretRef:
                name: food-delivery-secrets
          resources:
            {{- toYaml $service.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-service
  namespace: {{ include "food-delivery-system.namespace" . }}
  labels:
    app: restaurant-service
    {{- include "food-delivery-system.labels" . | nindent 4 }}
spec:
  selector:
    app: restaurant-service
  ports:
    - port: {{ $service.port }}
      targetPort: {{ $service.port }}
{{- end }}

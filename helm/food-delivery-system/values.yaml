global:
  namespace: food-delivery-system-helm
  createNamespace: true
  imageRegistry: ""
  imagePullPolicy: IfNotPresent
  labels: {}
  annotations: {}

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  replicas: 1
  storage:
    size: 10Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "7.0"
  replicas: 1
  storage:
    size: 10Gi
    accessMode: ReadWriteOnce
  service:
    type: ClusterIP
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

redis:
  enabled: true
  image:
    repository: redis
    tag: "7.2-alpine"
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

storage:
  enabled: true
  size: 5Gi
  accessMode: ReadWriteOnce
  storageClass: ""

config:
  mongoDb: "food_delivery"
  env: "production"
  uploadPath: "/app/uploads"
  maxUploadSize: "52428800"
  gatewayBaseUrl: "http://gateway:8080"
  firebaseProjectId: "food-delivery"
  firebaseCredentialsPath: "/app/firebase-credentials.json"
  ports:
    authService: "50051"
    userService: "50052"
    notificationService: "50053"
    fileStorageService: "50054"
    restaurantService: "50055"
    orderService: "50056"
    deliveryService: "50057"
    settingsService: "50058"
    gatewayHttp: "8080"
  addresses:
    authService: "auth-service:50051"
    userService: "user-service:50052"
    notificationService: "notification-service:50053"
    fileStorageService: "file-storage-service:50054"
    restaurantService: "restaurant-service:50055"
    orderService: "order-service:50056"
    deliveryService: "delivery-service:50057"
    settingsService: "settings-service:50058"

secrets:
  postgresUser: "postgres"
  postgresPassword: "postgres"
  postgresDb: "food_delivery"
  databaseUrl: "postgres://postgres:postgres@postgres:5432/food_delivery?sslmode=disable"
  mongoUri: "mongodb://mongodb:27017"
  redisUri: "redis:6379"
  jwtSecret: "your-super-secret-jwt-key-change-in-production"
  passwordPepper: "your-system-wide-pepper-change-in-production"
  superadminUsername: "admin"
  superadminPassword: "Admin@123"
  firebaseCredentials: |
    {
      "type": "service_account",
      "project_id": "food-delivery",
      "private_key_id": "change-me",
      "private_key": "-----BEGIN PRIVATE KEY-----\nCHANGE_ME\n-----END PRIVATE KEY-----\n",
      "client_email": "firebase-adminsdk@food-delivery.iam.gserviceaccount.com",
      "client_id": "change-me",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token",
      "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
      "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/firebase-adminsdk%40food-delivery.iam.gserviceaccount.com",
      "universe_domain": "googleapis.com"
    }

services:
  auth-service:
    enabled: true
    image: food-delivery-auth-service
    tag: latest
    replicas: 2
    port: 50051
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"

  user-service:
    enabled: true
    image: food-delivery-user-service
    tag: latest
    replicas: 2
    port: 50052
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"

  notification-service:
    enabled: true
    image: food-delivery-notification-service
    tag: latest
    replicas: 2
    port: 50053
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"

  file-storage-service:
    enabled: true
    image: food-delivery-file-storage-service
    tag: latest
    replicas: 2
    port: 50054
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"

  restaurant-service:
    enabled: true
    image: food-delivery-restaurant-service
    tag: latest
    replicas: 2
    port: 50055
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"

  order-service:
    enabled: true
    image: food-delivery-order-service
    tag: latest
    replicas: 2
    port: 50056
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"

  delivery-service:
    enabled: true
    image: food-delivery-delivery-service
    tag: latest
    replicas: 2
    port: 50057
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"

  settings-service:
    enabled: true
    image: food-delivery-settings-service
    tag: latest
    replicas: 2
    port: 50058
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"

gateway:
  enabled: true
  image: food-delivery-gateway
  tag: latest
  replicas: 2
  port: 8080
  service:
    type: LoadBalancer
    port: 8080
    targetPort: 8080
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

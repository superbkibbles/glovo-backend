apiVersion: v1
kind: Secret
metadata:
  name: food-delivery-secrets
  namespace: food-delivery-system
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "food_delivery"
  DATABASE_URL: "postgres://postgres:postgres@postgres:5432/food_delivery?sslmode=disable"
  MONGO_URI: "mongodb://mongodb:27017"
  REDIS_URI: "redis:6379"
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
  PASSWORD_PEPPER: "your-system-wide-pepper-change-in-production"
  SUPERADMIN_USERNAME: "admin"
  SUPERADMIN_PASSWORD: "Admin@123"
  FIREBASE_CREDENTIALS: |
    {
      "type": "service_account",
      "project_id": "food-delivery",
      "private_key_id": "change-me",
      "private_key": "-----BEGIN PRIVATE KEY-----\nCHANGE_ME\n-----END PRIVATE KEY-----\n",
      "client_email": "firebase-adminsdk@food-delivery.iam.gserviceaccount.com",
      "client_id": "change-me",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token",
      "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
      "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/firebase-adminsdk%40food-delivery.iam.gserviceaccount.com",
      "universe_domain": "googleapis.com"
    }

apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: food-delivery-system
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      volumes:
        - name: firebase-credentials
          secret:
            secretName: food-delivery-secrets
            items:
              - key: FIREBASE_CREDENTIALS
                path: firebase-credentials.json
      containers:
        - name: notification-service
          image: food-delivery-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50053
          envFrom:
            - configMapRef:
                name: food-delivery-config
            - secretRef:
                name: food-delivery-secrets
          volumeMounts:
            - name: firebase-credentials
              mountPath: /app/firebase-credentials.json
              subPath: firebase-credentials.json
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: food-delivery-system
spec:
  selector:
    app: notification-service
  ports:
    - port: 50053
      targetPort: 50053

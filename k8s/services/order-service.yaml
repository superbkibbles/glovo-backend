apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: food-delivery-system
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: food-delivery-order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50056
          envFrom:
            - configMapRef:
                name: food-delivery-config
            - secretRef:
                name: food-delivery-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: food-delivery-system
spec:
  selector:
    app: order-service
  ports:
    - port: 50056
      targetPort: 50056

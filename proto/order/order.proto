syntax = "proto3";

package order;

option go_package = "github.com/mendmzury/food-delivery/proto/order";

import "google/protobuf/timestamp.proto";
import "proto/common/common.proto";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (Order);
  rpc CancelOrder(CancelOrderRequest) returns (Order);
}

enum OrderStatus {
  ORDER_STATUS_PENDING = 0;
  ORDER_STATUS_ACCEPTED = 1;
  ORDER_STATUS_PREPARING = 2;
  ORDER_STATUS_READY = 3;
  ORDER_STATUS_ASSIGNED = 4;
  ORDER_STATUS_PICKED_UP = 5;
  ORDER_STATUS_DELIVERED = 6;
  ORDER_STATUS_CANCELLED = 7;
}

message Order {
  string id = 1;
  string customer_id = 2;
  string customer_name = 3;
  string restaurant_id = 4;
  string restaurant_name = 5;
  OrderStatus status = 6;
  double total = 7;
  string delivery_address = 8;
  double delivery_lat = 9;
  double delivery_lng = 10;
  string notes = 11;
  string driver_id = 12;
  string driver_name = 13;
  repeated OrderItem items = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

message OrderItem {
  string id = 1;
  string menu_item_id = 2;
  string menu_item_name = 3;
  int32 quantity = 4;
  double unit_price = 5;
  string options = 6;  // JSON
}

message CreateOrderRequest {
  string customer_id = 1;
  string restaurant_id = 2;
  string delivery_address = 3;
  double delivery_lat = 4;
  double delivery_lng = 5;
  string notes = 6;
  repeated OrderItemInput items = 7;
}

message OrderItemInput {
  string menu_item_id = 1;
  int32 quantity = 2;
  string options = 3;
}

message GetOrderRequest {
  string id = 1;
}

message ListOrdersRequest {
  common.PaginationRequest pagination = 1;
  string customer_id = 2;
  string restaurant_id = 3;
  string driver_id = 4;
  OrderStatus status = 5;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  common.PaginationMeta pagination = 2;
}

message UpdateOrderStatusRequest {
  string id = 1;
  OrderStatus status = 2;
}

message CancelOrderRequest {
  string id = 1;
}

syntax = "proto3";

package common;

option go_package = "github.com/mendmzury/food-delivery/proto/common";

import "google/protobuf/timestamp.proto";

message PaginationRequest {
  int64 page = 1;
  int64 page_size = 2;
}

message PaginationMeta {
  int64 page = 1;
  int64 page_size = 2;
  int64 total = 3;
  int64 total_pages = 4;
  bool has_next = 5;
  bool has_prev = 6;
}

message Empty {}

message IDRequest {
  string id = 1;
}

message SuccessResponse {
  bool success = 1;
  string message = 2;
}

message Address {
  string street = 1;
  string city = 2;
  string state = 3;
  string country = 4;
  string postal_code = 5;
}

message AuditInfo {
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp updated_at = 2;
  string created_by = 3;
  string updated_by = 4;
}
